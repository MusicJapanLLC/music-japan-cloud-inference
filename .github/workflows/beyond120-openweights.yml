name: REDLINE existing 397B bounded public evaluation
on:
  workflow_dispatch:
    inputs:
      quant:
        type: choice
        options: [IQ1_S, IQ1_M, IQ2_XXS, IQ2_XS, best-fit]
        default: IQ1_S
        required: true
        description: 'IQ1_S baseline; higher tiers unmeasured; best-fit selects one tier after actual capacity checks'
      cleanup_unused_sdks:
        type: boolean
        default: false
        required: true
        description: 'Optionally remove only allowlisted unused SDKs on this disposable hosted runner'
permissions:
  contents: read
concurrency:
  group: redline397b-manual
  cancel-in-progress: false
jobs:
  evaluate:
    if: ${{ github.repository == 'MusicJapanLLC/music-japan-cloud-inference' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline contract tests and public input identity
        working-directory: redline397b
        run: |
          set -euo pipefail
          python3 -m unittest discover -v
          python3 redline397b.py
      - name: Optional measured unused SDK cleanup on disposable runner
        if: ${{ inputs.cleanup_unused_sdks == true }}
        working-directory: redline397b
        run: |
          set -euo pipefail
          python3 clean_runner.py --execute > "$RUNNER_TEMP/redline397b-cleanup.json"
      - name: Build the fully pinned CPU runtime
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama.cpp" fetch --quiet --depth 1 origin 547208dca250ceb3e4c8615598d043f2b602a527
          git -C "$RUNNER_TEMP/llama.cpp" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = 547208dca250ceb3e4c8615598d043f2b602a527
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_CURL=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-server -j 4
      - name: One model load and three bounded public security cases
        working-directory: redline397b
        env:
          SELECTED_QUANT: ${{ inputs.quant }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          python3 redline397b.py --execute-public-synthetic --quant "$SELECTED_QUANT" \
            --binary "$RUNNER_TEMP/llama.cpp/build/bin/llama-server" \
            --runtime-source "$RUNNER_TEMP/llama.cpp" \
            --data "$RUNNER_TEMP/model-shards" \
            --out "$RUNNER_TEMP/redline397b-result.json"
      - name: Preserve small receipts only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: redline397b-${{ inputs.quant }}-evidence
          path: |
            ${{ runner.temp }}/redline397b-result.json
            ${{ runner.temp }}/redline397b-cleanup.json
          retention-days: 1
          if-no-files-found: warn
