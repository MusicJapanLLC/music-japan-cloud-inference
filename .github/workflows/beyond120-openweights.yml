name: Music Japan Beyond 120B — Official 235B Thinking and 397B MoE
on:
  push:
    branches:
      - feature/mj-beyond-120b-235b-397b-cloud-20261018
    paths:
      - '.github/workflows/beyond120-openweights.yml'
      - 'beyond120_openweight.py'
      - 'test_beyond120_openweight.py'
  workflow_dispatch:
    inputs:
      run_public_models:
        type: boolean
        required: true
        default: false
        description: 'Run SHA-pinned 235B IQ2 and 397B IQ1 on 2 independent free public Linux CPUs'
permissions:
  contents: read
concurrency:
  group: mj-beyond120-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate strict 235B/397B weight identities, resource gates and zero-credits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Dry run and source integrity tests (no model downloads)
        run: |
          set -euo pipefail
          python3 -m unittest -q test_beyond120_openweight.py
          python3 beyond120_openweight.py --profile thinking-235b-iq2m --binary unused --data "$RUNNER_TEMP" --out "$RUNNER_TEMP/a.json"
          python3 beyond120_openweight.py --profile frontier-397b-iq1s --binary unused --data "$RUNNER_TEMP" --out "$RUNNER_TEMP/b.json"
  real-inference:
    name: Separate real Linux machine — ${{ matrix.profile }}
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_public_models == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        profile: ['thinking-235b-iq2m', 'frontier-397b-iq1s']
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confirm actual owner-authorized public Linux machine
        run: |
          set -euo pipefail
          python3 cloud_probe.py
          python3 -m unittest -q test_beyond120_openweight.py
      - name: Compile real CPU inference runtime on this separate Linux machine
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_CURL=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-server -j 4
      - name: Fetch SHA-pinned public 235B or 397B GGUF and attempt actual one-shot inference
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          python3 beyond120_openweight.py --execute \
            --profile "${{ matrix.profile }}" \
            --binary "$RUNNER_TEMP/llama.cpp/build/bin/llama-server" \
            --data "$RUNNER_TEMP/model-shards" \
            --out "$RUNNER_TEMP/real-beyond120.json" \
            --tasks 1
      - name: Upload model output or load diagnostic receipt only, never weights
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: true-beyond120-${{ matrix.profile }}-evidence
          path: ${{ runner.temp }}/real-beyond120.json
          retention-days: 1
          if-no-files-found: ignore
