name: Music Japan Cloud Chat — high-effort genuine open-weight LLM
on:
  push:
    branches:
      - feature/mj-frontier-research-factory-20261018
    paths:
      - '.github/workflows/cloud-owner-chat.yml'
      - 'cloud_owner_chat.py'
      - 'test_cloud_owner_chat.py'
  workflow_dispatch:
    inputs:
      public_question:
        description: 'PUBLIC research question ONLY — never company or personal data (max 3200 chars)'
        type: string
        required: true
        default: 'Explain in three concise sentences why more thinking time does not always mean a better answer.'
      actual_inference:
        description: 'Run real pinned public OpenAI gpt-oss20B on free GitHub Linux CPU'
        type: boolean
        required: true
        default: false
      thinking_rounds:
        type: choice
        description: '1 direct answer, 2 includes independent review, 3 adds synthesis'
        options: ['1', '2', '3']
        default: '3'
      reasoning_effort:
        type: choice
        options: ['medium', 'high']
        default: high
      tokens_per_round:
        type: choice
        options: ['512', '1280', '2048']
        default: '1280'
permissions:
  contents: read
concurrency:
  group: mj-real-cloud-chat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit-tests:
    name: Code proofs and dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: No-model-credit general chat tests
        run: |
          set -euo pipefail
          python3 -m unittest -q test_cloud_owner_chat.py test_render_cloud_chat.py test_objective_verifier.py test_cloud_probe.py
          python3 cloud_owner_chat.py --binary nonexistent --weights-dir "$RUNNER_TEMP/weights" --out "$RUNNER_TEMP/answer.json"
  genuine-model-chat:
    name: Official open-weight model answers actual public prompt
    needs: unit-tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.actual_inference == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    env:
      MJ_PUBLIC_RESEARCH_QUESTION: ${{ inputs.public_question }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate ephemeral free CPU machine
        run: python3 cloud_probe.py
      - name: Compile official llama.cpp CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_CURL=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-server -j 4
      - name: Real authenticated loopback model inference — high thinking and recheck
        shell: bash
        run: |
          set -euo pipefail
          python3 cloud_owner_chat.py --execute \
            --binary "$RUNNER_TEMP/llama.cpp/build/bin/llama-server" \
            --weights-dir "$RUNNER_TEMP/weights" \
            --out "$RUNNER_TEMP/mj-cloud-answer.json" \
            --rounds "${{ inputs.thinking_rounds }}" \
            --effort "${{ inputs.reasoning_effort }}" \
            --tokens "${{ inputs.tokens_per_round }}" \
            --max-seconds 1200
      - name: Verify authentic answer and publish human-readable Summary
        if: ${{ success() }}
        run: |
          set -euo pipefail
          python3 render_cloud_chat.py --receipt "$RUNNER_TEMP/mj-cloud-answer.json"
      - name: Save verified answer artifact — public test prompt only, no model weights
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mj-genuine-cloud-chat-answer
          path: ${{ runner.temp }}/mj-cloud-answer.json
          retention-days: 1
          if-no-files-found: ignore
