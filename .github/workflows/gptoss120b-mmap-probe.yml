name: Music Japan Official 120B — One-Shot Free Linux CPU Feasibility
on:
  push:
    branches:
      - feature/mj-frontier-research-factory-20261018
    paths:
      - '.github/workflows/gptoss120b-mmap-probe.yml'
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        default: false
        required: true
        description: 'Attempt full SHA-256 official open 120B in free public Linux; no paid model API'
permissions:
  contents: read
concurrency:
  group: mj-120b-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Unit tests and offline original-weight identity proof
        run: |
          set -euo pipefail
          python3 -m unittest -q test_experimental_gptoss120b.py
          python3 experimental_gptoss120b.py --binary unused --weights "$RUNNER_TEMP/weights" --out "$RUNNER_TEMP/proof.json"
  actually-try-120b:
    needs: validation
    if: ${{ github.event_name == 'push' || inputs.execute == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confirm free public hosted Linux VM only
        run: |
          set -euo pipefail
          python3 cloud_probe.py
          python3 -m unittest -q test_experimental_gptoss120b.py
      - name: Compile official CPU-only llama.cpp engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_CURL=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-server -j 4
      - name: Verify 63GB pinned public model bytes and attempt actual 120B local inference
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          python3 experimental_gptoss120b.py --execute \
            --binary "$RUNNER_TEMP/llama.cpp/build/bin/llama-server" \
            --weights "$RUNNER_TEMP/model" \
            --out "$RUNNER_TEMP/120b-result.json"
      - name: Upload only technical result; never giant weights or keys
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: official-120b-mmap-viability
          path: ${{ runner.temp }}/120b-result.json
          retention-days: 1
          if-no-files-found: ignore
